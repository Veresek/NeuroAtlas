services:
  client:
    build:
      context: ./client
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./client/src/data/atlas.json:/app/src/data/atlas.json
      - ./client/src/data/research.json:/app/src/data/research.json

  server:
    build:
      context: ./server
    env_file:
      - ./.env
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "127.0.0.1:8000:8000"

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
