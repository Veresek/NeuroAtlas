services:
  client:
    build:
      context: ./client
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./client/src/data/atlas.json:/app/src/data/atlas.json
      - ./client/src/data/research.json:/app/src/data/research.json

  server:
    build:
      context: ./server
    env_file:
      - ./.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
