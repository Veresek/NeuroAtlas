services:
  client-build:
    image: node:24.16.0-alpine
    working_dir: /app
    volumes:
      - ./client:/app
    command: sh -lc "npm ci && npm run build"

  server:
    build:
      context: ./server
    env_file:
      - ./.env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
